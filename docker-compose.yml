services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-fintech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintech}
      POSTGRES_DB: ${DB_NAME:-fintech}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda speaks the Kafka protocol, so the client and the tests are unchanged, but it needs
  # a fraction of the memory and starts in seconds.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9093,external://localhost:${KAFKA_PORT:-9092}
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redpanda-data:
